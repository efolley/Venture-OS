# The full VentureOS stack on 1 machine: docker compose up --build, then open http://127.0.0.1:8080
#
# Browser -> gateway (:8080, the only published port) -> api -> Kafka -> worker
# PostgreSQL keeps chats and Research runs, Redis keeps short-term state. API keys come from .env.
# The database password below is for this local stack only; change it before exposing anything.

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    RESEARCH_DATABASE_URL: postgresql://ventureos:ventureos-local@postgres:5432/ventureos
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  volumes:
    - ./runs:/app/runs # GTM and PM results, shared by the api and the workers
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ventureos
      POSTGRES_PASSWORD: ventureos-local
      POSTGRES_DB: ventureos
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventureos -d ventureos"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      retries: 20

  api:
    <<: *app
    command: ["ventureos-api"]
    environment:
      <<: *app-env
      RESEARCH_API_HOST: 0.0.0.0

  worker:
    <<: *app
    command: ["ventureos-worker"]
    deploy:
      replicas: 2 # Kafka spreads the chat-turn partitions between them

  gateway:
    <<: *app
    command: ["ventureos-gateway"]
    environment:
      <<: *app-env
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }

volumes:
  postgres:
  redis:
  kafka:
