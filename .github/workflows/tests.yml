name: Tests
on: [push, pull_request]
jobs:
  research:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      RESEARCH_TEST_DATABASE_URL: postgresql://research:test-only@localhost:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[research,api,test]'
      - run: python -m unittest discover -s tests -v
