name: Competitive Strategy tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Offline tests only: provider doubles, no live web or model calls.
      - run: python -m pip install -e '.[strategy,test]'
      - name: Run tests
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s tests -v
          else
            echo "No Competitive Strategy tests yet (module is planned)."
          fi
