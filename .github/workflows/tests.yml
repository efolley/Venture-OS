name: Tests
on: [push, pull_request]
jobs:
  research:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:3.9.0
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 15
    env:
      PYTHONPATH: src
      RESEARCH_TEST_DATABASE_URL: postgresql://research:test-only@localhost:5432/research_test
      REDIS_TEST_URL: redis://localhost:6379/15
      KAFKA_TEST_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[research,api,queue,test]'
      - run: python -m unittest discover -s tests -v
