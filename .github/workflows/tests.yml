name: Shared prerequisites
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ventureos
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ventureos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ventureos -d ventureos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      VENTUREOS_TEST_DSN: postgresql://ventureos:test-only@localhost:5432/ventureos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[runtime,test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m ventureos.evals tests/fixtures/content_evals.json
      - run: python -S -m ventureos --brief examples/agency-brief.json
