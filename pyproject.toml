[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ventureos-research"
version = "0.1.0"
description = "VentureOS Research agent: collects verified web evidence about a company into an evidence pack"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
research = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
ui = ["streamlit>=1.35,<2"]
test = ["httpx>=0.27,<1"]

[project.scripts]
ventureos-research = "research.__main__:main"
ventureos-research-api = "research.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research = ["pack.schema.json", "migrations/*.sql"]
