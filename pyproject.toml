[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ventureos"
version = "0.1.0"
description = "Conversational Web Intelligence research agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chat = ["fastapi>=0.110,<1", "python-dotenv>=1.0,<2", "uvicorn>=0.29,<1"]
ui = ["streamlit>=1.35,<2", "requests>=2.31,<3"]
test = ["httpx>=0.27,<0.29", "httpx2>=2.0.0"]

[project.scripts]
web-intelligence-api = "web_intelligence.api:main"

[tool.setuptools.packages.find]
where = ["src"]
