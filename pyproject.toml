[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ventureos"
version = "0.0.0"
description = "Competitive Strategy agent: ranked opportunity hypotheses"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
strategy = ["fastapi>=0.110,<1", "python-dotenv>=1.0,<2", "uvicorn>=0.29,<1"]
ui = ["streamlit>=1.35,<2", "requests>=2.31,<3"]
test = ["httpx>=0.27,<0.29", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
