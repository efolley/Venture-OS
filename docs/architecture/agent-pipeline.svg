<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>VentureOS agent pipeline</title>
<desc>A company name or URL goes to the Researcher, then the GTM orchestrator, which runs market analysis, competitive strategy, and challenger salesperson in parallel. The PM agent checks the basics; if something is missing, a person chooses to research more (back to the Researcher) or proceed. The result is an action plan, a 1-pager, and an MVP idea for a person. Nothing is built or sent.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle}
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.2;fill:none}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
.lbl{fill:#5F5E5A;font-size:12px}
</style>
</defs>
<rect width="680" height="700" fill="#FFFFFF"/>

<g class="gray"><rect x="220" y="20" width="240" height="44" rx="8"/><text class="th" x="340" y="47">Company name or URL</text></g>
<path class="arr" d="M340 64V96" marker-end="url(#arrow)"/>

<g class="purple"><rect x="170" y="100" width="340" height="60" rx="8"/><text class="th" x="340" y="124">1 Researcher</text><text class="ts" x="340" y="144">searches the web, keeps only quoted, sourced facts</text></g>
<path class="arr" d="M340 160V192" marker-end="url(#arrow)"/>

<g class="teal"><rect x="170" y="196" width="340" height="60" rx="8"/><text class="th" x="340" y="220">2 GTM orchestrator</text><text class="ts" x="340" y="240">runs 3 specialists in parallel, then a snapshot</text></g>
<path class="arr" d="M260 256L130 290" marker-end="url(#arrow)"/>
<path class="arr" d="M340 256V290" marker-end="url(#arrow)"/>
<path class="arr" d="M420 256L550 290" marker-end="url(#arrow)"/>

<g class="teal"><rect x="30" y="294" width="200" height="56" rx="8"/><text class="th" x="130" y="317">Market analyst</text><text class="ts" x="130" y="336">size, trends, segments</text></g>
<g class="teal"><rect x="240" y="294" width="200" height="56" rx="8"/><text class="th" x="340" y="317">Competitive strategist</text><text class="ts" x="340" y="336">gaps, ranked in code</text></g>
<g class="teal"><rect x="450" y="294" width="200" height="56" rx="8"/><text class="th" x="550" y="317">Challenger salesperson</text><text class="ts" x="550" y="336">ideal customer, insight</text></g>
<path class="arr" d="M130 350L260 386" marker-end="url(#arrow)"/>
<path class="arr" d="M340 350V386" marker-end="url(#arrow)"/>
<path class="arr" d="M550 350L420 386" marker-end="url(#arrow)"/>

<g class="coral"><rect x="170" y="390" width="340" height="60" rx="8"/><text class="th" x="340" y="414">3 PM agent</text><text class="ts" x="340" y="434">checks the basics, picks 1 use case</text></g>
<path class="arr" d="M340 450V482" marker-end="url(#arrow)"/>

<g class="amber"><rect x="170" y="486" width="340" height="60" rx="8"/><text class="th" x="340" y="510">Human check (if something is missing)</text><text class="ts" x="340" y="530">research more, or proceed with gaps</text></g>
<path class="arr" d="M170 516H90V130H166" marker-end="url(#arrow)"/>
<text class="lbl" x="58" y="330" transform="rotate(-90 58 330)">research more</text>
<path class="arr" d="M340 546V588" marker-end="url(#arrow)"/>
<text class="lbl" x="392" y="572">proceed</text>

<g class="gray"><rect x="120" y="592" width="440" height="76" rx="8"/><text class="th" x="340" y="618">For a person to review and act on</text><text class="ts" x="340" y="638">action plan · 1-pager proposal · MVP idea</text><text class="ts" x="340" y="656">nothing is built or sent</text></g>
</svg>
